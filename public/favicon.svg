<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6B5A" />
      <stop offset="100%" stop-color="#0F4F42" />
    </linearGradient>
    <linearGradient id="petalCenter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B05E1A" />
      <stop offset="60%" stop-color="#D4762C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="petalLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4762C" />
      <stop offset="100%" stop-color="#F0A55A" />
    </linearGradient>
    <linearGradient id="petalRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D4762C" />
      <stop offset="100%" stop-color="#F0A55A" />
    </linearGradient>
    <linearGradient id="goldHeart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4762C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded circle for crisp favicon badge -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <circle cx="256" cy="300" r="160" fill="url(#sunGlow)" />

  <!-- Lotus Petals Architecture -->
  <!-- Back/Outer Petals -->
  <path d="M256 100 C200 170 140 250 140 330 C140 380 190 410 256 410 C322 410 372 380 372 330 C372 250 312 170 256 100 Z" fill="#B05E1A" opacity="0.6" />
  
  <!-- Mid Petals Left & Right -->
  <path d="M256 130 C180 180 100 250 100 325 C100 375 160 415 230 405 C190 365 180 300 210 230 Z" fill="url(#petalLeft)" />
  <path d="M256 130 C332 180 412 250 412 325 C412 375 352 415 282 405 C322 365 332 300 302 230 Z" fill="url(#petalRight)" />

  <!-- Main Center Petal -->
  <path d="M256 95 C222 165 178 240 178 320 C178 375 212 405 256 405 C300 405 334 375 334 320 C334 240 290 165 256 95 Z" fill="url(#petalCenter)" stroke="#FEF08A" stroke-width="2" />

  <!-- Front Accent Petals -->
  <path d="M256 210 C170 230 110 285 110 340 C110 380 160 415 220 405 C180 370 175 320 205 270 Z" fill="#F0A55A" />
  <path d="M256 210 C342 230 402 285 402 340 C402 380 352 415 292 405 C332 370 337 320 307 270 Z" fill="#F0A55A" />

  <!-- Base Leaf/Pool -->
  <path d="M120 385 C180 435 332 435 392 385 C335 448 177 448 120 385 Z" fill="#7BAE7F" />

  <!-- Inner Kundalini Heart Flame -->
  <path d="M256 205 C240 245 230 275 230 305 C230 330 242 350 256 350 C270 350 282 330 282 305 C282 275 272 245 256 205 Z" fill="url(#goldHeart)" />
  <circle cx="256" cy="295" r="14" fill="#FFFFFF" />
</svg>
